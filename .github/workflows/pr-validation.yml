name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: 🔎 Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            perf
            ci
        continue-on-error: true

      - name: Check for large files
        run: |
          find . -size +10M -not -path './.git/*' -not -path './node_modules/*' | while read f; do
            echo "❌ Large file found: $f"
            exit 1
          done
          echo "✅ No large files found"

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: Post PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🛡️ FraudShield PR Validation\n\n| Check | Status |\n|-------|--------|\n| PR Title | ✅ Valid |\n| Large Files | ✅ Clean |\n| Secret Scan | ✅ Clean |\n\n**Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\`\n**Commits:** ${pr.commits}`
            });
